# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish only the static web app, not the whole repository. The app
      # lives in web/ and loads ../data/catalog.json when there is no backend,
      # so the site keeps that layout and the root redirects to web/.
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site/web _site/data
          cp -r web/. _site/web/
          cp data/catalog.json _site/data/catalog.json
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Antigravity &amp; Hermes — Watch Next</title>
          <meta http-equiv="refresh" content="0; url=web/">
          <link rel="canonical" href="web/">
          <a href="web/">Open Watch Next</a>
          HTML
          touch _site/.nojekyll
          test -f _site/web/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
